appId: dev.ohmypi.pishift
productName: PiShift
npmRebuild: false
publish: null
directories:
  output: release
  buildResources: build
files:
  - out/**
  - extensions/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
linux:
  icon: build/icon.png
  category: Development
  synopsis: Desktop terminal shell for Oh My Pi (omp)
  maintainer: Dazaike <dazaike@users.noreply.github.com>
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
